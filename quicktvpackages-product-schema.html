        schema lives in the JavaScript bundle, so Google never sees it in the raw HTML.
        Paste this block into the RAW HTML of /pricing — which means it only works
        properly once the site is pre-rendered (Technique 1, the biggest fix in the plan).
        Do not paste it into the JS bundle. Until pre-render lands, keep this file ready.

        Twitter tags at all). The "image" line is left OUT on purpose — add a real image
        URL once one exists; do not guess one. Google will flag it as non-critical only.
     4) After deploying + pre-rendering, check Google's Rich Results Test on
        https://www.quicktvpackages.co.uk/pricing — it must show a valid Product
        with 4 offers, and Search Console must show no Merchant listings error.
